# Cloudflare Pages configuration for The Looney Bin.
# Cloudflare reads this file on every deploy from GitHub, so the Workers AI
# binding used by functions/api/tailor.js (AI resume tailoring and cover
# letters) is always attached, with no dashboard setup needed.
name = "the-looney-bin"
pages_build_output_dir = "."
compatibility_date = "2025-09-01"

[ai]
binding = "AI"
