# Cloudflare Pages configuration for The Looney Bin.
# Cloudflare reads this file on every deploy from GitHub, so the Workers AI
# binding used by functions/api/tailor.js (AI resume tailoring and cover
# letters) is always attached, with no dashboard setup needed.
name = "the-looney-bin"
pages_build_output_dir = "."
compatibility_date = "2025-09-01"

[ai]
binding = "AI"

# Accounts: users, sessions, invites, and each person's saved data and resume files.
[[d1_databases]]
binding = "DB"
database_name = "the-looney-bin"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
# Google sign-in is switched on by putting the Google OAuth client ID here (it is public, not a secret).
GOOGLE_CLIENT_ID = ""
