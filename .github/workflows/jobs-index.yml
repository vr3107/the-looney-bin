# Rebuilds the daily job index (about 1.2 million US jobs from company career sites) and
# publishes it to the Cloudflare Pages project "looney-bin-jobs", which the app reads.
# Runs every day after the source dataset refreshes, and can be started by hand
# (Actions → Daily job index → Run workflow).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   API token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
name: Daily job index

on:
  schedule:
    - cron: "25 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobs-index
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the index
        run: node --max-old-space-size=6000 scripts/build-jobs-index.mjs dist-index

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create looney-bin-jobs --production-branch=main || true
          npx --yes wrangler@3 pages deploy dist-index --project-name=looney-bin-jobs --branch=main --commit-dirty=true
